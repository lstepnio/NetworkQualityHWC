name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so versionCode (rev-list count) is correct

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p $HOME/.fision-keystores
          echo "$KEYSTORE_BASE64" | base64 -d > $HOME/.fision-keystores/release.jks
          test -s $HOME/.fision-keystores/release.jks || (echo "decoded keystore is empty" && exit 1)

      - name: Derive version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(git rev-list --count HEAD)
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version name: $TAG"
          echo "Version code: $CODE"

      - name: Build signed release APK
        env:
          FISION_VERSION_NAME: ${{ steps.version.outputs.name }}
          FISION_VERSION_CODE: ${{ steps.version.outputs.code }}
          KEYSTORE_PATH: ${{ env.HOME }}/.fision-keystores/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          DEST=fisiontv-network-certifier-${{ github.ref_name }}.apk
          test -f "$SRC" || (echo "release APK missing at $SRC" && exit 1)
          cp "$SRC" "$DEST"
          ls -la "$DEST"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: fisiontv-network-certifier-${{ github.ref_name }}.apk
