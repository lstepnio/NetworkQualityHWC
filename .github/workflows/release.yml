name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so versionCode (rev-list count) is correct
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
          mkdir -p "$KEYSTORE_DIR"
          KEYSTORE_PATH="$KEYSTORE_DIR/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || (echo "decoded keystore is empty" && exit 1)
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Derive version
        id: version
        # versionCode = 1000 + rev-list count. The +1000 offset lifts the
        # CI-driven track above the hand-built 100-series APKs that were
        # used during early self-update bring-up (codes 100..103). Keeps a
        # single monotonic versionCode axis so the STB will always upgrade,
        # never see a downgrade rejection.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$((1000 + $(git rev-list --count HEAD)))
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version name: $TAG"
          echo "Version code: $CODE"

      - name: Build signed release APK
        env:
          FISION_VERSION_NAME: ${{ steps.version.outputs.name }}
          FISION_VERSION_CODE: ${{ steps.version.outputs.code }}
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          DEST=fisiontv-network-certifier-${{ github.ref_name }}.apk
          test -f "$SRC" || (echo "release APK missing at $SRC" && exit 1)
          cp "$SRC" "$DEST"
          ls -la "$DEST"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: fisiontv-network-certifier-${{ github.ref_name }}.apk
